---
layout: default
---


<div id="calendar-grid" class="grid">
    {% assign chronological_posts = site.posts | reverse %}
    {% for post in chronological_posts %}
    <a href="{{ post.url | relative_url }}" class="case"
       style="background-image: url('{{ site.github.url }}/assets/img/{{ post.image }}')">
      <span class="case-title">{{ post.title }}</span>
    </a>
  {% endfor %}
</div>

<style>
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 20px;
  width: 90%;
  max-width: 1000px;
  margin: 0 auto;
  padding: 20px 0;
}

/* The advent case */
.case {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  border: 4px solid #b30000;
  border-radius: 12px;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  text-decoration: none;
  display: flex;
  justify-content: center;
  align-items: center;
  cursor: pointer;
  transition: transform 0.3s ease;
}

/* Hover animation */
.case:hover {
  transform: scale(1.05);
}

/* Title text */
.case-title {
  font-size: 1.4rem;
  font-weight: bold;
  color: white;
  text-shadow: 0 0 8px black;
  padding: 10px;
  text-align: center;
}
</style>
